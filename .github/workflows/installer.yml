name: installer

# Builds the signed Windows installer (PyInstaller backend + Tauri shell).
#   - by hand (Actions -> installer -> Run workflow): the installer is kept as an artifact, nothing is published;
#   - by pushing a tag like v0.1.2: it is published as a GitHub release together with latest.json, which is what the
#     installed apps look at to show "a new version is available". The tag must match the version in tauri.conf.json.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but tauri.conf.json says $v"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Backend (frozen with PyInstaller)
        shell: bash
        run: |
          python -m pip install -e . pyinstaller
          python -m PyInstaller packaging/pulse.spec --noconfirm --distpath build/dist --workpath build/work
      - name: Desktop shell and installer
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v6
        with:
          name: Pulse-setup
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd desktop/src-tauri/target/release/bundle/nsis
          exe=$(ls *-setup.exe); sig=$(cat "$exe.sig")
          python - "$exe" "$sig" <<'PY'
          import json, sys, os, datetime
          exe, sig = sys.argv[1], sys.argv[2]
          tag = os.environ["GITHUB_REF_NAME"]
          json.dump({"version": tag.lstrip("v"), "notes": "", "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "platforms": {"windows-x86_64": {"signature": sig, "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{exe}"}}},
                    open("latest.json", "w"), indent=2)
          PY
          gh release create "$GITHUB_REF_NAME" "$exe" "$exe.sig" latest.json --title "Pulse ${GITHUB_REF_NAME#v}" --generate-notes
