name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # The project reads Windows-specific things (PowerShell signature checks, Task Scheduler, PresentMon CSVs).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: Unit tests (no Ollama and no GPU needed)
        shell: bash
        run: |
          # One process per file: several tests swap module attributes and must not leak into each other.
          for f in tests/test_*.py; do
            echo "== $f"
            python "$f" || exit 1
          done
