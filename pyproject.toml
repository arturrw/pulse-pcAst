[project]
name = "pulse"
version = "0.2.0"
description = "Local AI assistant that analyzes the state of your own computer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ollama", "local-llm", "system-monitoring", "anomaly-detection", "windows", "presentmon"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=6.0",
    "nvidia-ml-py>=12.0",
    "ollama>=0.5",
]

[project.urls]
Repository = "https://github.com/arturrw/pulse-pcAst"

[project.scripts]
pulse = "pulse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
